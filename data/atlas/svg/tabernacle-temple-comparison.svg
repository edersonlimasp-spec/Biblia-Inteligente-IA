<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Plantas internas lado a lado em escala gráfica comum; côvado de referência igual"><defs><linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E5C987"/><stop offset=".35" stop-color="#A97825"/><stop offset="1" stop-color="#6F471C"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#F0E7D5"/><stop offset="1" stop-color="#BEB29D"/></linearGradient><pattern id="dressed" width="25" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H25M12 0V8M0 8H25M7 8V16" fill="none" stroke="#655B4C" stroke-opacity=".34" stroke-width="1.5"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4l8 4" fill="none" stroke="#F0E7D5" stroke-width="1.4"/></marker></defs><rect width="700" height="500" fill="#14272B"/><text x="24" y="34" fill="#F2E8D4" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Tabernáculo × Templo · planta em mesma escala</text><circle cx="65" cy="111" r="14" fill="#F2E8D4" stroke="#14272B" stroke-width="2"/><text x="65" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#14272B">1</text><text x="100" y="86" fill="#F2E8D4" font-size="17" font-family="system-ui,sans-serif" font-weight="700">TABERNÁCULO · planta interna tradicional</text><g id="part-tabernacle-plan"><rect x="100" y="113" width="150" height="50" fill="#7A4E2D" stroke="#F2E8D4" stroke-width="2"/><rect x="200" y="113" width="50" height="50" fill="#AD966A" stroke="#F2E8D4" stroke-width="2"/><path d="M200 113V163" stroke="#F2E8D4" stroke-width="4" stroke-dasharray="5 4"/></g><text x="150" y="136" text-anchor="middle" fill="#FFF1D4" font-size="12" font-family="system-ui,sans-serif">Lugar Santo</text><text x="150" y="153" text-anchor="middle" fill="#FFF1D4" font-size="11" font-family="system-ui,sans-serif">20 × 10*</text><text x="225" y="136" text-anchor="middle" fill="#14272B" font-size="10" font-family="system-ui,sans-serif">S.S.</text><text x="225" y="153" text-anchor="middle" fill="#14272B" font-size="10" font-family="system-ui,sans-serif">10 × 10*</text><text x="272" y="124" fill="#E9C98B" font-size="12" font-family="system-ui,sans-serif">*inferência tradicional da planta</text><text x="272" y="144" fill="#D6CDBB" font-size="11" font-family="system-ui,sans-serif">10×10 do Santo dos Santos:</text><text x="272" y="161" fill="#D6CDBB" font-size="11" font-family="system-ui,sans-serif">cálculo tradicional, não cota direta</text><g id="part-comparison-table"><text x="500" y="86" fill="#F2E8D4" font-size="14" font-family="system-ui,sans-serif" font-weight="700">MÓVEIS · TENDA → TEMPLO</text><text x="500" y="111" fill="#E9C98B" font-size="12" font-family="system-ui,sans-serif">pia: 1 → mar + 10 pias</text><text x="500" y="132" fill="#E9C98B" font-size="12" font-family="system-ui,sans-serif">candelabro: 1 → 10</text><text x="500" y="153" fill="#E9C98B" font-size="12" font-family="system-ui,sans-serif">mesa: 1 → 10</text><text x="500" y="174" fill="#E9C98B" font-size="12" font-family="system-ui,sans-serif">altar: 5×5 → 20×20 côvados</text><text x="500" y="195" fill="#D6CDBB" font-size="11" font-family="system-ui,sans-serif">móvel → fixo (resumo contextual)</text></g><text x="100" y="235" fill="#F2E8D4" font-size="17" font-family="system-ui,sans-serif" font-weight="700">TEMPLO · divisões internas</text><g id="part-temple-plan"><rect x="100" y="259" width="200" height="100" fill="#B99F71" stroke="#F2E8D4" stroke-width="2"/><rect x="300" y="259" width="100" height="100" fill="#D4C39D" stroke="#F2E8D4" stroke-width="2"/><path d="M300 259V359" stroke="#14272B" stroke-width="2"/></g><text x="200" y="303" text-anchor="middle" fill="#14272B" font-size="15" font-family="system-ui,sans-serif">Lugar Santo · 40 × 20</text><text x="200" y="327" text-anchor="middle" fill="#14272B" font-size="12" font-family="system-ui,sans-serif">côvados</text><text x="350" y="303" text-anchor="middle" fill="#14272B" font-size="14" font-family="system-ui,sans-serif">debir</text><text x="350" y="326" text-anchor="middle" fill="#14272B" font-size="12" font-family="system-ui,sans-serif">20 × 20</text><path d="M100 375H400" stroke="#F2E8D4" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="250" y="397" text-anchor="middle" fill="#F2E8D4" font-size="13" font-family="system-ui,sans-serif">40 + 20 = 60 côvados · ≈ 27 m · largura 20 ≈ 9 m</text><text x="250" y="423" text-anchor="middle" fill="#CFB77B" font-size="12" font-family="system-ui,sans-serif">mesma escala: 5 px = 1 côvado · sem espessura de paredes</text><path d="M24 454H676" stroke="#617276" stroke-width="1"/><text x="24" y="477" fill="#D6CDBB" font-family="system-ui,sans-serif" font-size="12">Esquema textual · côvado comum ≈ 0,45 m; côvado longo ≈ 0,52 m (Ez 40:5)</text><text x="24" y="496" fill="#AFBDBA" font-family="system-ui,sans-serif" font-size="11">2Cr 3:3 menciona a medida antiga; conversão métrica aproximada, sem equivalência exata.</text></svg>
