 <g id="part-height-marker"><rect x="24" y="370" width="672" height="68" rx="8" fill="#2d392e" stroke="#e2bc61" stroke-width="2" stroke-dasharray="8 5"/><text x="42" y="397" fill="#f6d885" font-family="sans-serif" font-size="16" font-weight="700">Altura em 2Cr 3:4: 120 côvados — divergência textual</text><text x="42" y="422" fill="#e0ddcd" font-family="sans-serif" font-size="14">Problema debatido; 1Rs 6:3 não informa altura. Planta não projeta a cifra na escala.</text></g>
