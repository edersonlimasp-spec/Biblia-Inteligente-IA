<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Acampamento das tribos ao redor do Tabernáculo</title>
<desc id="desc">Diagrama textual, não mapa nem planta em escala. Judá, Issacar e Zebulom a leste; Rúben, Simeão e Gade ao sul; Efraim, Manassés e Benjamim a oeste; Dã, Aser e Naftali ao norte. Famílias levíticas no círculo interno.</desc>
<rect width="1000" height="760" fill="#142923"/><text x="500" y="31" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="22">Nm 2–3 · orientação textual, sem escala</text>
<text x="500" y="66" text-anchor="middle" fill="#e4a45e" font-family="sans-serif">NORTE · Dã</text>
<g><rect x="250" y="85" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="325" y="111" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Dã</text><text x="325" y="134" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">62.700</text></g>
<g><rect x="425" y="85" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="500" y="111" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Aser</text><text x="500" y="134" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">41.500</text></g>
<g><rect x="600" y="85" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="675" y="111" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Naftali</text><text x="675" y="134" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">53.400</text></g>
<text x="500" y="590" text-anchor="middle" fill="#e4a45e" font-family="sans-serif">SUL · Rúben</text>
<g><rect x="250" y="610" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="325" y="636" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Rúben</text><text x="325" y="659" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">46.500</text></g>
<g><rect x="425" y="610" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="500" y="636" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Simeão</text><text x="500" y="659" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">59.300</text></g>
<g><rect x="600" y="610" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="675" y="636" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Gade</text><text x="675" y="659" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">45.650</text></g>
<text x="110" y="169" text-anchor="middle" fill="#e4a45e" font-family="sans-serif">OESTE · Efraim</text>
<g><rect x="35" y="190" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="110" y="216" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Efraim</text><text x="110" y="239" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">40.500</text></g>
<g><rect x="35" y="315" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="110" y="341" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Manassés</text><text x="110" y="364" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">32.200</text></g>
<g><rect x="35" y="440" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="110" y="466" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Benjamim</text><text x="110" y="489" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">35.400</text></g>
<text x="890" y="169" text-anchor="middle" fill="#e4a45e" font-family="sans-serif">LESTE · Judá</text>
<g><rect x="815" y="190" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="890" y="216" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Judá</text><text x="890" y="239" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">74.600</text></g>
<g><rect x="815" y="315" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="890" y="341" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Issacar</text><text x="890" y="364" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">54.400</text></g>
<g><rect x="815" y="440" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="890" y="466" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Zebulom</text><text x="890" y="489" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">57.400</text></g>
<rect x="240" y="220" width="520" height="350" rx="24" fill="none" stroke="#a99b7f" stroke-dasharray="6 7"/>
<g><rect x="425" y="247" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="500" y="273" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Meraritas</text><text x="500" y="296" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">norte</text></g>
<g><rect x="275" y="355" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="350" y="381" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Gersonitas</text><text x="350" y="404" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">oeste</text></g>
<g><rect x="575" y="355" width="170" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="660" y="381" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Moisés e Arão</text><text x="660" y="404" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">sacerdotes · leste</text></g>
<g><rect x="425" y="464" width="150" height="66" rx="10" fill="#244037" stroke="#82c8b8"/><text x="500" y="490" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">Coatitas</text><text x="500" y="513" text-anchor="middle" fill="#e4a45e" font-family="sans-serif" font-size="15">sul</text></g>
<rect x="433" y="346" width="134" height="93" rx="12" fill="#ad8654" stroke="#f2dab1"/><text x="500" y="398" text-anchor="middle" fill="#16251f" font-family="sans-serif" font-weight="bold" font-size="16">TABERNÁCULO</text>
<text x="500" y="712" text-anchor="middle" fill="#f2e9d9" font-family="sans-serif" font-size="16">O texto não fornece distâncias nem formato exato do acampamento.</text></svg>
