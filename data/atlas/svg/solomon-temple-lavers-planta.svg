<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Representação esquemática superior da pia de bronze"><defs><linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E5C987"/><stop offset=".35" stop-color="#A97825"/><stop offset="1" stop-color="#6F471C"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#F0E7D5"/><stop offset="1" stop-color="#BEB29D"/></linearGradient><pattern id="dressed" width="25" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H25M12 0V8M0 8H25M7 8V16" fill="none" stroke="#655B4C" stroke-opacity=".34" stroke-width="1.5"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4l8 4" fill="none" stroke="#F0E7D5" stroke-width="1.4"/></marker></defs><rect width="700" height="500" fill="#14272B"/><text x="24" y="34" fill="#F2E8D4" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Dez pias · planta</text><circle cx="220" cy="145" r="14" fill="#F2E8D4" stroke="#14272B" stroke-width="2"/><text x="220" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#14272B">1</text><ellipse cx="370" cy="238" rx="121" ry="87" fill="none" stroke="#E1C582" stroke-width="6" stroke-dasharray="12 8"/><ellipse cx="370" cy="238" rx="104" ry="69" fill="#5C7E7C" fill-opacity=".4" stroke="#F2E8D4" stroke-width="2"/><text x="370" y="230" text-anchor="middle" fill="#F2E8D4" font-size="18" font-family="system-ui,sans-serif" font-weight="700">pia esquemática</text><text x="370" y="256" text-anchor="middle" fill="#E9C98B" font-size="15" font-family="system-ui,sans-serif">40 batos por pia</text><path d="M244 238H496" stroke="#D6CDBB" stroke-width="1.4" stroke-dasharray="5 5"/><text x="370" y="359" text-anchor="middle" fill="#F2E8D4" font-size="15" font-family="system-ui,sans-serif">Medida textual: 4 côvados ≈ 1,80 m*</text><text x="370" y="381" text-anchor="middle" fill="#CFB77B" font-size="12" font-family="system-ui,sans-serif">eixo geométrico não especificado em 1Rs 7:38</text><text x="370" y="413" text-anchor="middle" fill="#D6CDBB" font-size="13" font-family="system-ui,sans-serif">10 unidades no relato · uma sobre cada base</text><path d="M24 454H676" stroke="#617276" stroke-width="1"/><text x="24" y="477" fill="#D6CDBB" font-family="system-ui,sans-serif" font-size="12">Esquema textual · côvado comum ≈ 0,45 m; côvado longo ≈ 0,52 m (Ez 40:5)</text><text x="24" y="496" fill="#AFBDBA" font-family="system-ui,sans-serif" font-size="11">2Cr 3:3 menciona a medida antiga; conversão métrica aproximada, sem equivalência exata.</text></svg>
