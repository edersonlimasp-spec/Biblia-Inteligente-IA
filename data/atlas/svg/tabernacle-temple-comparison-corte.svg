<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Cortes em planta dos recintos internos alinhados na mesma escala gráfica"><defs><linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E5C987"/><stop offset=".35" stop-color="#A97825"/><stop offset="1" stop-color="#6F471C"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#F0E7D5"/><stop offset="1" stop-color="#BEB29D"/></linearGradient><pattern id="dressed" width="25" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H25M12 0V8M0 8H25M7 8V16" fill="none" stroke="#655B4C" stroke-opacity=".34" stroke-width="1.5"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4l8 4" fill="none" stroke="#F0E7D5" stroke-width="1.4"/></marker></defs><rect width="700" height="500" fill="#14272B"/><text x="24" y="34" fill="#F2E8D4" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Tabernáculo × Templo · corte interno</text><circle cx="69" cy="125" r="14" fill="#F2E8D4" stroke="#14272B" stroke-width="2"/><text x="69" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#14272B">1</text><text x="100" y="101" fill="#F2E8D4" font-size="14" font-family="system-ui,sans-serif" font-weight="700">TABERNÁCULO*</text><rect x="100" y="171" width="120" height="40" fill="#7A4E2D" stroke="#F2E8D4" stroke-width="2" stroke-dasharray="8 5"/><rect x="180" y="171" width="40" height="40" fill="#AD966A" stroke="#F2E8D4" stroke-width="2" stroke-dasharray="8 5"/><path d="M180 171V211" stroke="#F2E8D4" stroke-width="3" stroke-dasharray="5 4"/><text x="140" y="190" text-anchor="middle" fill="#F2E8D4" font-size="10" font-family="system-ui,sans-serif">LS 20×10</text><text x="200" y="188" text-anchor="middle" fill="#14272B" font-size="9" font-family="system-ui,sans-serif">SS</text><text x="200" y="202" text-anchor="middle" fill="#14272B" font-size="8" font-family="system-ui,sans-serif">10×10*</text><text x="160" y="239" text-anchor="middle" fill="#DCCB9F" font-size="10" font-family="system-ui,sans-serif">*inferência tradicional</text><text x="362" y="101" fill="#F2E8D4" font-size="14" font-family="system-ui,sans-serif" font-weight="700">TEMPLO · planta do eixo interno</text><rect x="360" y="171" width="160" height="80" fill="#B99F71" stroke="#F2E8D4" stroke-width="2"/><rect x="520" y="171" width="80" height="80" fill="#D4C39D" stroke="#F2E8D4" stroke-width="2"/><text x="440" y="207" text-anchor="middle" fill="#14272B" font-size="12" font-family="system-ui,sans-serif">LS · 40×20</text><text x="560" y="202" text-anchor="middle" fill="#14272B" font-size="11" font-family="system-ui,sans-serif">debir · 20</text><text x="560" y="222" text-anchor="middle" fill="#14272B" font-size="10" font-family="system-ui,sans-serif">20×20</text><text x="480" y="280" text-anchor="middle" fill="#D6CDBB" font-size="11" font-family="system-ui,sans-serif">mesmo fator gráfico: 4 px por côvado</text><text x="350" y="335" text-anchor="middle" fill="#E9C98B" font-size="13" font-family="system-ui,sans-serif">O 10×10 do Santo dos Santos da tenda é inferência tradicional</text><text x="350" y="361" text-anchor="middle" fill="#F2E8D4" font-size="13" font-family="system-ui,sans-serif">Templo: comprimento interno 40 + 20 = 60 côvados (1Rs 6:17–20)</text><text x="350" y="387" text-anchor="middle" fill="#D6CDBB" font-size="12" font-family="system-ui,sans-serif">Alturas externas e espessuras não são cotadas nesta vista</text><path d="M24 454H676" stroke="#617276" stroke-width="1"/><text x="24" y="477" fill="#D6CDBB" font-family="system-ui,sans-serif" font-size="12">Esquema textual · côvado comum ≈ 0,45 m; côvado longo ≈ 0,52 m (Ez 40:5)</text><text x="24" y="496" fill="#AFBDBA" font-family="system-ui,sans-serif" font-size="11">2Cr 3:3 menciona a medida antiga; conversão métrica aproximada, sem equivalência exata.</text></svg>
