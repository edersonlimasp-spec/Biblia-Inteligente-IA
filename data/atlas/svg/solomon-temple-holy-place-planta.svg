 <text x="24" y="386" fill="#f2d68c" font-family="sans-serif" font-size="14">O texto cita 5 candelabros de cada lado e 5 mesas de cada lado.</text>
 <text x="24" y="414" fill="#c5cfbf" font-family="sans-serif" font-size="13">A planta mostra apenas símbolos exemplares; escala/posição de cada peça não informadas.</text>
